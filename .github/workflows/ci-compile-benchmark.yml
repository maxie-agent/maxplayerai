name: CI compilation experiment
on:
  push:
    branches: [experiment/ci-compile-times]
    paths:
      - '.github/workflows/ci-compile-benchmark.yml'
      - 'scripts/ci-benchmark/*.py'
permissions:
  contents: read
jobs:
  benchmark:
    name: ${{ matrix.suite }} / ${{ matrix.order }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        suite: [union, money]
        order: [baseline-first, no-lto-first]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - name: Record runner and compiler
        run: |
          mkdir -p benchmark-results
          { rustc -Vv; cargo -V; lscpu; free -h; } > benchmark-results/environment.txt
      # Deliberately no restored cache: every variant measures its own cold
      # build, then the same dependency-warm workspace rebuild.
      - name: Measure compilation and run complete suite
        env:
          ORDER: ${{ matrix.order }}
          SUITE: ${{ matrix.suite }}
          CARGO_TERM_COLOR: never
        run: python3 scripts/ci-benchmark/paired.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paired-${{ matrix.suite }}-${{ matrix.order }}
          path: |
            benchmark-results/
            target-baseline/cargo-timings/
            target-no-lto/cargo-timings/
